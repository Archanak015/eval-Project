version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: uniconnect-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: uniconnect
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniconnect-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/uniconnect
      JWT_SECRET: uniconnect_docker_secret_key_2026
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo-data:
